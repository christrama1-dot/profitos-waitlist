# ProfitOS Waitlist — Netlify Phase 1 config (dry-run prep)
# Purpose: fallback hosting path in case Vercel 2FA lockout is not resolved in time for launch.
# Scope: static HTML/CSS/JS pages only. API functions are NOT yet ported (see notes below).

[build]
  publish = "."
  command = ""

