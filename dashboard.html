<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>ProfitOS Founder Dashboard</title>
<style>
  #flag-btn {
    position: fixed; bottom: 20px; right: 20px; z-index: 9000;
    background: #9F8FEF; color: #fff; border: none; border-radius: 999px;
    padding: 12px 22px; font-family: 'Inter', sans-serif; font-size: 0.85rem;
    font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: opacity .2s, transform .1s;
  }
  #flag-btn:hover { opacity: .88; }
  #flag-btn:active { transform: scale(.96); }

  #flag-overlay {
    display: none; position: fixed; inset: 0; z-index: 9100;
    background: rgba(0,0,0,0.72); align-items: center; justify-content: center;
    padding: 16px;
  }
  #flag-overlay.open { display: flex; }

  #flag-modal {
    background: #12141F; border: 1px solid rgba(232,233,240,0.1);
    border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 440px;
    font-family: 'Inter', sans-serif;
  }
  #flag-modal h3 { font-size: 1.1rem; font-weight: 800; color: #E8E9F0; margin-bottom: 6px; }
  #flag-modal p.sub { font-size: 0.82rem; color: rgba(232,233,240,.5); margin-bottom: 24px; }

  .flag-stars { display: flex; gap: 8px; margin-bottom: 20px; }
  .star {
    font-size: 1.5rem; cursor: pointer; color: rgba(232,233,240,0.22);
    transition: color .15s; user-select: none;
  }
  .star.active { color: #00FF88; }

  .flag-field { margin-bottom: 16px; }
  .flag-field label {
    display: block; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(232,233,240,0.45); margin-bottom: 7px;
    font-family: 'JetBrains Mono', monospace;
  }
  .flag-field textarea {
    width: 100%; background: #1A1D2E; border: 1px solid rgba(232,233,240,0.08);
    border-radius: 10px; color: #E8E9F0; font-family: 'Inter', sans-serif;
    font-size: 0.88rem; padding: 12px 14px; outline: none;
    resize: none; min-height: 80px; line-height: 1.6; box-sizing: border-box;
    transition: border-color .2s;
  }
  .flag-field textarea:focus { border-color: #9F8FEF; }
  .flag-field textarea::placeholder { color: rgba(232,233,240,.2); }

  .flag-btns { display: flex; gap: 10px; margin-top: 20px; }
  #flag-submit {
    flex: 1; background: #9F8FEF; color: #fff; border: none; border-radius: 999px;
    padding: 14px; font-family: 'Inter', sans-serif; font-size: 0.9rem;
    font-weight: 700; cursor: pointer; transition: opacity .2s;
  }
  #flag-submit:hover { opacity: .88; }
  #flag-submit:disabled { opacity: .5; cursor: not-allowed; }
  #flag-cancel {
    background: none; border: 1px solid rgba(232,233,240,.12); border-radius: 999px;
    color: rgba(232,233,240,.5); font-family: 'Inter', sans-serif;
    font-size: 0.85rem; padding: 14px 20px; cursor: pointer; transition: border-color .2s;
  }
  #flag-cancel:hover { border-color: rgba(232,233,240,.3); }

  #flag-toast {
    display: none; position: fixed; bottom: 80px; right: 20px; z-index: 9200;
    background: #00FF88; color: #0D0F1A; border-radius: 999px;
    padding: 12px 22px; font-family: 'Inter', sans-serif;
    font-size: 0.85rem; font-weight: 700;
    box-shadow: 0 4px 20px rgba(0,255,136,0.35);
    animation: toastIn 0.3s ease;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
<script>(function(){const H='759e9530bf8afba291c57a986f15b7d3c8b31409dc03b5b15e37910841e1a01b';async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}function gate(){document.documentElement.style.visibility='hidden';window.addEventListener('DOMContentLoaded',()=>{document.body.innerHTML='<div style="background:#080808;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:monospace"><div style="width:360px;text-align:center"><div style="font-size:1.4rem;font-weight:900;color:#fff;margin-bottom:6px">Profit<span style="color:#00FF88">OS</span> Engine</div><div style="font-size:.65rem;color:#888;letter-spacing:.2em;text-transform:uppercase;margin-bottom:40px">Founder Dashboard - Private</div><input id="p" type="password" placeholder="Access code" style="width:100%;background:#111;border:1px solid #333;color:#fff;font-family:monospace;font-size:1rem;padding:16px 20px;outline:none;margin-bottom:12px;box-sizing:border-box" onkeydown="if(event.key===\'Enter\')chk()"/><button onclick="chk()" style="width:100%;background:#00FF88;color:#080808;font-weight:900;font-size:1rem;padding:16px;border:none;cursor:pointer">Access Dashboard</button><div id="e" style="color:#FF3B30;font-size:.78rem;margin-top:12px;min-height:18px"></div></div></div>';document.documentElement.style.visibility='visible';setTimeout(()=>document.getElementById('p').focus(),100);});}async function chk(){const v=document.getElementById('p').value;if(!v)return;const h=await sha256(v);if(h===H){sessionStorage.setItem('pa','1');location.reload();}else{document.getElementById('e').textContent='Incorrect.';document.getElementById('p').value='';}}window.chk=chk;if(sessionStorage.getItem('pa')!=='1')gate();})();</script></head>

<body style="background:#080808;color:#fff;font-family:monospace;margin:0;padding:40px;text-align:center">
<h1 style="color:#00FF88">ProfitOS Founder Dashboard</h1>
<p style="color:#888;margin-top:20px">Full dashboard loading...</p>
<p style="margin-top:16px"><a href="https://profitosengine.com" style="color:#9F8FEF">Back to main site</a></p>

<!-- FLAG THIS BUTTON -->
<button id="flag-btn" onclick="flagOpen()">Flag This</button>

<!-- FLAG MODAL OVERLAY -->
<div id="flag-overlay" onclick="flagOverlayClick(event)">
  <div id="flag-modal">
    <h3>Flag Something</h3>
    <p class="sub">Takes 30 seconds. Helps us build a better product.</p>

    <div class="flag-stars" id="flag-stars" aria-label="Rating">
      <span class="star" onclick="flagStar(1)" data-v="1">&#9733;</span>
      <span class="star" onclick="flagStar(2)" data-v="2">&#9733;</span>
      <span class="star" onclick="flagStar(3)" data-v="3">&#9733;</span>
      <span class="star" onclick="flagStar(4)" data-v="4">&#9733;</span>
      <span class="star" onclick="flagStar(5)" data-v="5">&#9733;</span>
    </div>

    <div class="flag-field">
      <label for="flag-task">What were you trying to do?</label>
      <textarea id="flag-task" placeholder="Describe the task or action you were trying to complete..."></textarea>
    </div>
    <div class="flag-field">
      <label for="flag-stop">What stopped you?</label>
      <textarea id="flag-stop" placeholder="What went wrong, was confusing, or wasn't working the way you expected?"></textarea>
    </div>

    <div class="flag-btns">
      <button id="flag-cancel" onclick="flagClose()">Cancel</button>
      <button id="flag-submit" onclick="flagSubmit()">Send Feedback</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="flag-toast">Got it. Thank you.</div>

<script>
var flagRating = 0;

function flagOpen() {
  flagRating = 0;
  document.querySelectorAll('.star').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('flag-task').value = '';
  document.getElementById('flag-stop').value = '';
  document.getElementById('flag-overlay').classList.add('open');
  setTimeout(function() { document.getElementById('flag-task').focus(); }, 100);
}

function flagClose() {
  document.getElementById('flag-overlay').classList.remove('open');
}

function flagOverlayClick(e) {
  if (e.target === document.getElementById('flag-overlay')) flagClose();
}

function flagStar(n) {
  flagRating = n;
  document.querySelectorAll('.star').forEach(function(s) {
    s.classList.toggle('active', parseInt(s.dataset.v, 10) <= n);
  });
}

function flagSubmit() {
  var task = document.getElementById('flag-task').value.trim();
  var stop = document.getElementById('flag-stop').value.trim();
  var btn  = document.getElementById('flag-submit');

  if (!task && !stop) {
    document.getElementById('flag-task').focus();
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Sending\u2026';

  fetch('/api/flag-feedback', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ rating: flagRating, task: task, stop: stop, page: location.pathname })
  })
  .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
  .then(function() {
    flagClose();
    btn.disabled    = false;
    btn.textContent = 'Send Feedback';
    showToast();
  })
  .catch(function(err) {
    btn.disabled    = false;
    btn.textContent = 'Send Feedback';
    console.error('Flag error:', err);
    // Still close and toast — don't block user on a failed feedback submission
    flagClose();
    showToast();
  });
}

function showToast() {
  var t = document.getElementById('flag-toast');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 3200);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') flagClose();
});
</script>
</body>
</html>
